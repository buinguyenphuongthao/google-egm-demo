name: deploy-stage

on:
  workflow_call:
    inputs:
      environment:
        description: staging or prod
        type: string
        required: true
      artifact:
        description: Name of the uploaded cdk.out artifact to deploy
        type: string
        required: true
      version:
        description: Git SHA the artifact was built from
        type: string
        required: true
      ref:
        description: Git ref to check out for the setup action and smoke suite (defaults to github.sha)
        type: string
        required: false
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.site_url }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.artifact }}
          path: infra/cdk.out
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: deploy
        env:
          STACK: egm-${{ inputs.environment }}
        run: |
          npx cdk deploy --app infra/cdk.out "$STACK" --require-approval never --outputs-file outputs.json
          echo "site_url=$(jq -r --arg s "$STACK" '.[$s].SiteUrl' outputs.json)" >> "$GITHUB_OUTPUT"
      - run: npx playwright install --with-deps chromium
      - name: Smoke test
        env:
          SMOKE_BASE_URL: ${{ steps.deploy.outputs.site_url }}
          EXPECTED_VERSION: ${{ inputs.version }}
          # Environment secret; the edge function admits CI only with this header.
          SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}
        run: npm run test:smoke
      # prod and its rollback run in the same workflow run, so the name must tell them apart.
      - if: failure()
        id: report-name
        env:
          VERSION: ${{ inputs.version }}
        run: echo "short=${VERSION:0:7}" >> "$GITHUB_OUTPUT"
      # Traces and the HTML report record request headers, including the smoke token, and
      # artifacts are public on this repo, so the report is encrypted like audit output.
      - if: failure()
        uses: ./.github/actions/encrypt-upload
        with:
          name: smoke-report-${{ inputs.environment }}-${{ inputs.ref && 'rollback' || 'deploy' }}-${{ steps.report-name.outputs.short }}-${{ github.run_attempt }}
          paths: |
            smoke/playwright-report
            smoke/test-results
