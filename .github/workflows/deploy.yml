name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run build
      # Synthesize once; staging and prod deploy this exact cloud assembly.
      - run: npm run synth -w infra -- -c version=${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: cdk-out-${{ github.sha }}
          path: infra/cdk.out
          retention-days: 7

  staging:
    needs: build
    uses: ./.github/workflows/_deploy-stage.yml
    permissions:
      id-token: write
      contents: read
    with:
      environment: staging
      artifact: cdk-out-${{ github.sha }}
      version: ${{ github.sha }}

  prod:
    needs: staging
    uses: ./.github/workflows/_deploy-stage.yml
    permissions:
      id-token: write
      contents: read
    with:
      environment: prod
      artifact: cdk-out-${{ github.sha }}
      version: ${{ github.sha }}

  mark-good:
    needs: prod
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          git tag -f prod-good "$GITHUB_SHA"
          git push -f origin refs/tags/prod-good

  rollback-build:
    needs: prod
    if: failure() && needs.prod.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prod-good
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup
      - run: npm run build
      - run: npm run synth -w infra -- -c version=${{ steps.sha.outputs.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: cdk-out-rollback-${{ github.run_id }}
          path: infra/cdk.out
          retention-days: 7

  rollback:
    needs: rollback-build
    uses: ./.github/workflows/_deploy-stage.yml
    permissions:
      id-token: write
      contents: read
    with:
      environment: prod
      artifact: cdk-out-rollback-${{ github.run_id }}
      version: ${{ needs.rollback-build.outputs.sha }}
      ref: ${{ needs.rollback-build.outputs.sha }}
